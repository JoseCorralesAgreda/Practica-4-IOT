<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Circuito propuesto: ESP32, PIR, servo, sensor NPN y RGB</title>
  <desc id="desc">Pines 18 para servo, 27 para PIR, 26 para sensor con pull-up interno del ESP32, sin resistencia externa, y 21, 22, 23 para RGB de cátodo común con resistencias individuales.</desc>
  <rect width="1100" height="720" fill="white"/>
  <style>
    text{font-family:Arial,sans-serif;fill:#192d32;font-size:15px}
    .title{font-size:24px;font-weight:bold}.small{font-size:13px}.pin{font-size:14px}
    .wire{fill:none;stroke:#24544b;stroke-width:2.5;stroke-linejoin:round}
    .part{fill:#f1f6f3;stroke:#192d32;stroke-width:2}
    .symbol{fill:none;stroke:#192d32;stroke-width:2}
    .note{font-size:14px;fill:#71450e}
  </style>
  <text x="30" y="35" class="title">Ambientador · circuito propuesto para la Práctica 4</text>
  <text x="30" y="62">5 V DC · señales ESP32 a 3.3 V · verificar identificación de cables antes de conectar</text>
  <rect x="420" y="130" width="235" height="415" rx="8" class="part"/>
  <text x="465" y="160" style="font-size:20px;font-weight:bold">ESP32 DOIT</text>
  <text x="465" y="184">DEVKIT V1</text>
  <text x="443" y="224" class="pin">GPIO27</text>
  <text x="443" y="364" class="pin">GPIO26</text>
  <text x="443" y="454" class="small">Pull-up interno</text>
  <text x="443" y="474" class="small">INPUT_PULLUP</text>
  <text x="574" y="224" class="pin">GPIO18</text>
  <text x="574" y="334" class="pin">GPIO21</text>
  <text x="574" y="404" class="pin">GPIO22</text>
  <text x="574" y="474" class="pin">GPIO23</text>
  <text x="500" y="523" class="pin">GND</text>
  <text x="470" y="575">Alimentación por USB</text>
  <path d="M535 545 V555" class="wire"/>
  <path d="M520 555 H550 M524 562 H546 M529 569 H541" class="symbol"/>

  <rect x="45" y="145" width="205" height="115" rx="5" class="part"/>
  <text x="75" y="176" style="font-weight:bold">PIR HC-SR501</text>
  <text x="65" y="198" class="pin">VCC: 5 V / GND común</text>
  <text x="145" y="224" class="pin">OUT</text>
  <path d="M250 220 H420" class="wire"/>
  <text x="290" y="207" class="small">OUT ≤3.3 V</text>

  <rect x="45" y="310" width="205" height="175" rx="5" class="part"/>
  <text x="60" y="338" style="font-weight:bold">XKC-Y23A-NPN</text>
  <text x="60" y="365" class="pin">OUT (colector abierto)</text>
  <text x="60" y="403" class="pin">VCC: 5 V</text>
  <text x="60" y="430" class="pin">GND: masa común</text>
  <text x="60" y="459" class="small">LOW = líquido detectado</text>
  <path d="M250 360 H420" class="wire"/>
  <path d="M420 360 H550 V385 l-7 6 14 8 -14 8 14 8 -14 8 7 6" class="wire"/>
  <text x="555" y="427" class="small">3.3 V</text>
  <text x="265" y="392" class="small">OUT directo</text>
  <text x="265" y="414" class="small">Sin R externa</text>

  <rect x="835" y="145" width="220" height="115" rx="5" class="part"/>
  <text x="860" y="175" style="font-weight:bold">Servomotor SG90</text>
  <text x="850" y="198" class="pin">5 V externos / GND común</text>
  <text x="850" y="224" class="pin">Señal PWM 50 Hz</text>
  <path d="M655 220 H835" class="wire"/>

  <text x="720" y="294" style="font-weight:bold">RGB de cátodo común</text>
  <path d="M655 330 H710 l6 -7 8 14 8 -14 8 14 8 -14 6 7 H825" class="wire"/>
  <path d="M655 400 H710 l6 -7 8 14 8 -14 8 14 8 -14 6 7 H825" class="wire"/>
  <path d="M655 470 H710 l6 -7 8 14 8 -14 8 14 8 -14 6 7 H825" class="wire"/>
  <text x="710" y="317" class="small">330 Ω</text>
  <text x="710" y="387" class="small">330 Ω</text>
  <text x="710" y="457" class="small">330 Ω</text>
  <path d="M825 317 V343 L850 330 Z M852 315 V345 M852 330 H960" class="symbol"/>
  <path d="M825 387 V413 L850 400 Z M852 385 V415 M852 400 H960" class="symbol"/>
  <path d="M825 457 V483 L850 470 Z M852 455 V485 M852 470 H960" class="symbol"/>
  <path d="M842 311 l12 -12 m-7 0 h7 v7 M855 315 l12 -12 m-7 0 h7 v7" class="symbol"/>
  <path d="M842 381 l12 -12 m-7 0 h7 v7 M855 385 l12 -12 m-7 0 h7 v7" class="symbol"/>
  <path d="M842 451 l12 -12 m-7 0 h7 v7 M855 455 l12 -12 m-7 0 h7 v7" class="symbol"/>
  <text x="880" y="318" class="small">Rojo</text>
  <text x="880" y="388" class="small">Verde</text>
  <text x="880" y="458" class="small">Azul</text>
  <path d="M960 330 V520" class="wire"/>
  <circle cx="960" cy="400" r="4" fill="#24544b"/>
  <circle cx="960" cy="470" r="4" fill="#24544b"/>
  <path d="M945 520 H975 M949 527 H971 M954 534 H966" class="symbol"/>
  <text x="865" y="559" class="small">Cátodo a GND común</text>

  <rect x="30" y="595" width="1035" height="101" rx="6" fill="#fff3de"/>
  <text x="45" y="620" class="note">Todas las masas son comunes. No unir 5 V externos con USB sin gestión de alimentación.</text>
  <text x="45" y="643" class="note">Servo: desacoplo próximo 100 nF + 470 µF entre 5 V y GND; dimensionar fuente para la carga.</text>
  <text x="45" y="666" class="note">Sensor: comprobar OUT de 0 a 3.3 V; adaptar nivel si hay pull-up interno a 5 V. Recipiente no metálico.</text>
  <text x="45" y="687" class="note">El nivel bajo solo cambia el RGB a rojo; no inhibe el servo. Montaje físico pendiente de validación.</text>
</svg>
